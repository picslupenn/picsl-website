<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Barlow, Helvetica, Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16567a"/></marker>
  </defs>
  <text x="300" y="45" text-anchor="middle" font-size="20" font-weight="600" fill="#16567a">4D image: one 3D volume per time point</text>

  <!-- cardiac cycle frames: a valve opening and closing -->
  <g stroke="#16567a" stroke-width="2.5">
    <rect x="40" y="70" width="90" height="90" rx="6" fill="#1b2a33"/>
    <rect x="145" y="70" width="90" height="90" rx="6" fill="#1b2a33"/>
    <rect x="250" y="70" width="90" height="90" rx="6" fill="#1b2a33"/>
    <rect x="355" y="70" width="90" height="90" rx="6" fill="#1b2a33"/>
    <rect x="460" y="70" width="90" height="90" rx="6" fill="#1b2a33"/>
  </g>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M60,115 Q85,135 85,135 Q85,135 110,115" stroke="#00a8d8"/>
    <path d="M165,110 Q182,138 190,140 Q198,138 215,110" stroke="#cfd8dc"/>
    <path d="M270,105 Q283,140 290,145 Q297,140 310,105" stroke="#00a8d8"/>
    <path d="M375,110 Q392,138 400,140 Q408,138 425,110" stroke="#cfd8dc"/>
    <path d="M480,115 Q505,135 505,135 Q505,135 530,115" stroke="#00a8d8"/>
  </g>
  <line x1="40" y1="180" x2="550" y2="180" stroke="#16567a" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="185" font-size="13" fill="#16567a">t</text>
  <g font-size="12" fill="#16567a" text-anchor="middle"><text x="85" y="198">segmented</text><text x="295" y="198">segmented</text><text x="505" y="198">segmented</text></g>

  <!-- three tools -->
  <g text-anchor="middle">
    <rect x="25" y="230" width="170" height="130" rx="12" fill="#16567a"/>
    <text x="110" y="268" font-size="19" font-weight="600" fill="#ffffff">ITK-SNAP 4</text>
    <text x="110" y="298" font-size="14" fill="#ffffff">4D image I/O,</text>
    <text x="110" y="317" font-size="14" fill="#ffffff">visualization and</text>
    <text x="110" y="336" font-size="14" fill="#ffffff">segmentation</text>

    <rect x="215" y="230" width="170" height="130" rx="12" fill="#00a8d8"/>
    <text x="300" y="268" font-size="19" font-weight="600" fill="#ffffff">Greedy</text>
    <text x="300" y="290" font-size="19" font-weight="600" fill="#ffffff">Propagation</text>
    <text x="300" y="317" font-size="14" fill="#ffffff">sparse 3D segmentations</text>
    <text x="300" y="336" font-size="14" fill="#ffffff">→ full 4D segmentation</text>

    <rect x="405" y="230" width="170" height="130" rx="12" fill="#16567a"/>
    <text x="490" y="268" font-size="19" font-weight="600" fill="#ffffff">Scherzo</text>
    <text x="490" y="298" font-size="14" fill="#ffffff">fast web-based</text>
    <text x="490" y="317" font-size="14" fill="#ffffff">4D model generation</text>
    <text x="490" y="336" font-size="14" fill="#ffffff">and visualization</text>
  </g>
</svg>
