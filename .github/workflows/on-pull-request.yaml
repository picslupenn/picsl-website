name: on-pull-request
run-name: On pull request activity

on:
  # run on any pull request activity
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  citation-changes:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/check-citation-changes.yaml

  get-sources:
    needs: citation-changes
    if: needs.citation-changes.outputs.changed == 'true'
    uses: ./.github/workflows/get-sources.yaml

  update-citations:
    if: github.event.action != 'closed'
    needs: get-sources
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  build-preview:
    # Also run when citations are unchanged, or PR closed for preview cleanup.
    if: ${{ !cancelled() && !failure() }}
    needs: update-citations
    uses: ./.github/workflows/build-preview.yaml
