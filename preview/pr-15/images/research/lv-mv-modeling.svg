<text x="81.75" y="177" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">3D TEE</text>
<text x="81.75" y="207" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">pre-operative</text>
<text x="81.75" y="224" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">transesophageal</text>
<text x="81.75" y="241" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">echo</text>
<line x1="146" y1="200.0" x2="164" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
