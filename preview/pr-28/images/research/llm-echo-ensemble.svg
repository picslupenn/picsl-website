<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Barlow, Helvetica, Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16567a"/>
    </marker>
  </defs>

  <!-- free-text echo report -->
  <g transform="translate(30,95)">
    <path d="M0,0 h100 l25,25 v185 h-125 z" fill="#f2f8fb" stroke="#16567a" stroke-width="2.5"/>
    <path d="M100,0 v25 h25" fill="none" stroke="#16567a" stroke-width="2.5"/>
    <g stroke="#8fd3ec" stroke-width="5" stroke-linecap="round">
      <line x1="15" y1="45" x2="105" y2="45"/>
      <line x1="15" y1="65" x2="90" y2="65"/>
      <line x1="15" y1="85" x2="108" y2="85"/>
      <line x1="15" y1="105" x2="70" y2="105"/>
      <line x1="15" y1="125" x2="100" y2="125"/>
      <line x1="15" y1="145" x2="85" y2="145"/>
      <line x1="15" y1="165" x2="105" y2="165"/>
    </g>
    <text x="62" y="240" text-anchor="middle" font-size="17" fill="#16567a" font-weight="600">TEE report</text>
  </g>

  <!-- five open-source LLMs -->
  <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="215" y="70" width="110" height="38" rx="8" fill="#16567a"/><text x="270" y="94">LLM 1</text>
    <rect x="215" y="122" width="110" height="38" rx="8" fill="#16567a"/><text x="270" y="146">LLM 2</text>
    <rect x="215" y="174" width="110" height="38" rx="8" fill="#16567a"/><text x="270" y="198">LLM 3</text>
    <rect x="215" y="226" width="110" height="38" rx="8" fill="#16567a"/><text x="270" y="250">LLM 4</text>
    <rect x="215" y="278" width="110" height="38" rx="8" fill="#16567a"/><text x="270" y="302">LLM 5</text>
  </g>
  <g stroke="#16567a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M160,200 C185,200 190,89 212,89"/>
    <path d="M160,200 C185,200 190,141 212,141"/>
    <path d="M160,200 L212,193"/>
    <path d="M160,200 C185,200 190,245 212,245"/>
    <path d="M160,200 C185,200 190,297 212,297"/>
  </g>

  <!-- consensus vote -->
  <g stroke="#16567a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M325,89 C355,89 355,193 383,193"/>
    <path d="M325,141 C350,141 355,193 383,193"/>
    <path d="M325,193 L383,193"/>
    <path d="M325,245 C350,245 355,193 383,193"/>
    <path d="M325,297 C355,297 355,193 383,193"/>
  </g>
  <circle cx="412" cy="193" r="27" fill="#00a8d8"/>
  <path d="M399,193 l9,10 l17,-20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="412" y="245" text-anchor="middle" font-size="15" fill="#16567a" font-weight="600">vote</text>
  <line x1="440" y1="193" x2="458" y2="193" stroke="#16567a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- structured output -->
  <g transform="translate(462,128)" font-size="13">
    <rect width="122" height="130" rx="6" fill="#f2f8fb" stroke="#16567a" stroke-width="2.5"/>
    <line x1="0" y1="43" x2="122" y2="43" stroke="#8fd3ec" stroke-width="2"/>
    <line x1="0" y1="86" x2="122" y2="86" stroke="#8fd3ec" stroke-width="2"/>
    <text x="10" y="18" fill="#16567a" font-weight="600">LV ejection</text>
    <text x="10" y="35" fill="#16567a" font-weight="600">fraction</text>
    <text x="10" y="61" fill="#16567a" font-weight="600">RV systolic</text>
    <text x="10" y="78" fill="#16567a" font-weight="600">function</text>
    <text x="10" y="104" fill="#16567a" font-weight="600">Tricuspid</text>
    <text x="10" y="121" fill="#16567a" font-weight="600">regurgitation</text>
  </g>
  <text x="523" y="285" text-anchor="middle" font-size="17" fill="#16567a" font-weight="600">structured data</text>
</svg>
