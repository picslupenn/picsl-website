<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Barlow, Helvetica, Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16567a"/></marker>
  </defs>
  <text x="300" y="58" text-anchor="middle" font-size="22" font-weight="600" fill="#16567a">From ML algorithm to clinical practice</text>

  <g text-anchor="middle" font-weight="600">
    <rect x="30" y="120" width="150" height="150" rx="12" fill="#16567a"/>
    <circle cx="105" cy="160" r="20" fill="#00a8d8"/><text x="105" y="167" font-size="20" fill="#ffffff">1</text>
    <text x="105" y="215" font-size="17" fill="#ffffff">Problem</text>
    <text x="105" y="237" font-size="17" fill="#ffffff">identification</text>

    <rect x="225" y="120" width="150" height="150" rx="12" fill="#16567a"/>
    <circle cx="300" cy="160" r="20" fill="#00a8d8"/><text x="300" y="167" font-size="20" fill="#ffffff">2</text>
    <text x="300" y="215" font-size="17" fill="#ffffff">Stakeholder</text>
    <text x="300" y="237" font-size="17" fill="#ffffff">alignment</text>

    <rect x="420" y="120" width="150" height="150" rx="12" fill="#16567a"/>
    <circle cx="495" cy="160" r="20" fill="#00a8d8"/><text x="495" y="167" font-size="20" fill="#ffffff">3</text>
    <text x="495" y="215" font-size="17" fill="#ffffff">Pipeline</text>
    <text x="495" y="237" font-size="17" fill="#ffffff">integration</text>
  </g>
  <line x1="182" y1="195" x2="221" y2="195" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
  <line x1="377" y1="195" x2="416" y2="195" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>

  <g font-size="14" fill="#16567a" text-anchor="middle">
    <text x="105" y="300">What clinical need</text><text x="105" y="318">will ML address?</text>
    <text x="300" y="300">Radiologists, IT,</text><text x="300" y="318">clinicians, leadership</text>
    <text x="495" y="300">Deploy into the</text><text x="495" y="318">radiology workflow</text>
  </g>
</svg>
