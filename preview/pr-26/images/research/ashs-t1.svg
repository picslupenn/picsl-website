<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Barlow, Helvetica, Arial, sans-serif"><rect width="600" height="400" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16567a"/></marker></defs>
<text x="300" y="50" font-size="20" fill="#16567a" font-weight="600" text-anchor="middle">ASHS-T1: MTL subregions from routine T1 MRI</text>
<rect x="20" y="95" width="124" height="210" rx="12" fill="#16567a"/>
<circle cx="82" cy="127" r="17" fill="#ffffff"/>
<text x="81.75" y="133" font-size="17" fill="#16567a" font-weight="600" text-anchor="middle">1</text>
<text x="81.75" y="177" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">Atlas set</text>
<text x="81.75" y="207" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">15 normal adults,</text>
<text x="81.75" y="224" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">14 with MCI;</text>
<text x="81.75" y="241" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">dura labeled</text>
<line x1="146" y1="200.0" x2="164" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
<rect x="166" y="95" width="124" height="210" rx="12" fill="#16567a"/>
<circle cx="227" cy="127" r="17" fill="#ffffff"/>
<text x="227.25" y="133" font-size="17" fill="#16567a" font-weight="600" text-anchor="middle">2</text>
<text x="227.25" y="177" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">Multi-atlas</text>
<text x="227.25" y="197" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">segmentation</text>
<text x="227.25" y="227" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">ASHS pipeline</text>
<line x1="291" y1="200.0" x2="309" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
<rect x="311" y="95" width="124" height="210" rx="12" fill="#16567a"/>
<circle cx="373" cy="127" r="17" fill="#ffffff"/>
<text x="372.75" y="133" font-size="17" fill="#16567a" font-weight="600" text-anchor="middle">3</text>
<text x="372.75" y="177" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">MTL</text>
<text x="372.75" y="197" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">subregions</text>
<text x="372.75" y="227" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">hippocampus,</text>
<text x="372.75" y="244" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">ERC, BA35,</text>
<text x="372.75" y="261" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">BA36, PHC</text>
<line x1="436" y1="200.0" x2="454" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
<rect x="456" y="95" width="124" height="210" rx="12" fill="#00a8d8"/>
<circle cx="518" cy="127" r="17" fill="#ffffff"/>
<text x="518.25" y="133" font-size="17" fill="#00a8d8" font-weight="600" text-anchor="middle">4</text>
<text x="518.25" y="177" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">ADNI</text>
<text x="518.25" y="197" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">application</text>
<text x="518.25" y="227" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">663 participants:</text>
<text x="518.25" y="244" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">early loss in BA35,</text>
<text x="518.25" y="261" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">ERC, posterior</text>
<text x="518.25" y="278" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">hippocampus</text>
<text x="300" y="355" font-size="15" fill="#16567a" font-weight="400" text-anchor="middle">Dura mislabeled as gray matter: 6.5% with ASHS-T1 vs 62.4% with FreeSurfer</text>
</svg>