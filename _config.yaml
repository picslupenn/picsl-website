# site properties and page defaults
title: PICSL
subtitle: Penn Image Computing and Science Laboratory
description: The Penn Image Computing and Science Laboratory (PICSL) develops computational methods for biomedical image analysis, including segmentation, registration, morphometry and shape analysis.
url: https://picsl.upenn.edu
baseurl: ""
header: images/background.jpg
footer: images/background.jpg
proofer: false
# the logo already spells out "PICSL", so show only the subtitle next to it
show-title: false

# site social media and other links
links:
  twitter: picslupenn
  address: https://maps.app.goo.gl/?q=Richards+Medical+Research+Laboratories+3700+Hamilton+Walk+Philadelphia+PA

# external links at the end of the top menu (icon, text and tooltip are optional)
nav-links:
  - url: https://x.com/picslupenn
    icon: fa-brands fa-x-twitter
    tooltip: "@picslupenn on X"
  - url: https://bsky.app/profile/picslupenn.bsky.social
    icon: fa-brands fa-bluesky
    tooltip: "@picslupenn.bsky.social on Bluesky"

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - CLAUDE.md
  - tools
  - .migrate_cache
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
