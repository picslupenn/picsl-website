<text x="227.25" y="177" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">nnU-Net</text>
<text x="227.25" y="207" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">automatic</text>
<text x="227.25" y="224" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">segmentation</text>
<line x1="291" y1="200.0" x2="309" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
<rect x="311" y="95" width="124" height="210" rx="12" fill="#16567a"/>
<circle cx="373" cy="127" r="17" fill="#ffffff"/>
<text x="372.75" y="133" font-size="17" fill="#16567a" font-weight="600" text-anchor="middle">3</text>
