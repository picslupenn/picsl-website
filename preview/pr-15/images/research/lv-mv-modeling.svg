<text x="372.75" y="227" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">deformable</text>
<text x="372.75" y="244" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">diffeomorphic</text>
<text x="372.75" y="261" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">fitting</text>
<line x1="436" y1="200.0" x2="454" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
<rect x="456" y="95" width="124" height="210" rx="12" fill="#00a8d8"/>
<circle cx="518" cy="127" r="17" fill="#ffffff"/>
