<text x="227.25" y="207" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">RBANS cognitive</text>
<text x="227.25" y="224" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">scores, number of</text>
<text x="227.25" y="241" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">concussions,</text>
