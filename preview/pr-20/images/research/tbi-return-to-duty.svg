<text x="372.75" y="197" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">model</text>
<text x="372.75" y="227" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">n = 81 with</text>
<text x="372.75" y="244" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">imaging,</text>
<text x="372.75" y="261" font-size="12" fill="#ffffff" font-weight="400" text-anchor="middle">AUC 0.77</text>
<line x1="436" y1="200.0" x2="454" y2="200.0" stroke="#16567a" stroke-width="3" marker-end="url(#a)"/>
