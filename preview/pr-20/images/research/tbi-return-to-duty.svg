<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Barlow, Helvetica, Arial, sans-serif"><rect width="600" height="400" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16567a"/></marker></defs>
<text x="300" y="50" font-size="20" fill="#16567a" font-weight="600" text-anchor="middle">Predicting return to duty after blast-related mild TBI</text>
